services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dejure:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/dejure
    ports:
      # Host nginx terminates TLS and proxies to this port (same topology as the old bot).
      - "127.0.0.1:3006:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Alerts `docker ps` (and any restart policy watcher) when lead delivery is stuck.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:3000/health', timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dejure
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dejure
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Localhost only, for migration scripts and psql debugging from the host.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dejure -d dejure"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
