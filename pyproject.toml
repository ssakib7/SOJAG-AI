[project]
name = "dejure-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agno>=2.9.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "google-genai>=2.19.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "openai>=3.3.1",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.52",
    "tzdata>=2026.3",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
